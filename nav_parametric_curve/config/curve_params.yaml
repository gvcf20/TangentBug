curve_follower:
  ros__parameters:
    curve_type: 'lemniscate'
    curve_scale: 2.0         # diminuir — robô menor, curva menor
    k_normal: 1.5
    k_tangent: 1.0
    convergence_radius: 3.0
    v_max: 0.22              # TurtleBot3 Burger max
    omega_max: 2.84
    k_omega: 2.0
    control_rate: 20.0
    log_trajectory: true
    log_file: '/tmp/curve_trajectory.csv'
potential_field:
  ros__parameters:
    k_att: 1.0
    k_rep: 1.0              # aumentar — robô menor precisa reagir mais rápido
    d0: 1.2                  # diminuir — laser só alcança 3.5 m
    d_threshold: 1.5
    goal_tolerance: 0.15     # menor — robô menor, tolerância menor
    v_max: 0.22              # velocidade máxima do TurtleBot3 Burger real
    omega_max: 2.84          # velocidade angular máxima do TB3 Burger real
    k_omega: 2.0
    control_rate: 20.0
    wall_follow_distance: 0.35
    wall_follow_duration: 5.0
    log_trajectory: true
    log_file: '/tmp/potential_field_trajectory.csv'